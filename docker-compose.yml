services:
  oneimg:
    image: ghcr.io/yayitinyu/oneimg:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: oneimg
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      # 将自动生成的配置保存在已持久化的数据目录中
      - ONEIMG_ENV_FILE=/app/data/.env
    volumes:
      # 数据持久化
      - ./data:/app/data
      # 本地上传目录
      - ./uploads:/app/uploads
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
